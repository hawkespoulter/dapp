# Park boards for the park game. Area names must match PARK_AREAS / the map
# overlay images.
#   adjacency: which areas border each other (symmetric; list each pair once
#              or both ways)
# Each game splits the park at random: the villain spreads from her lair to
# half the park and the players get the rest.
Magic Kingdom:
  adjacency:
    "Main Street, U.S.A.": [Adventureland, Liberty Square, Fantasyland, Tomorrowland]
    Adventureland: ["Main Street, U.S.A.", Frontierland, Liberty Square]
    Frontierland: [Adventureland, Liberty Square]
    Liberty Square: ["Main Street, U.S.A.", Adventureland, Frontierland, Fantasyland]
    Fantasyland: ["Main Street, U.S.A.", Liberty Square, Tomorrowland]
    Tomorrowland: ["Main Street, U.S.A.", Fantasyland]
Animal Kingdom:
  adjacency:
    Discovery Island: [Africa, Asia, "DinoLand U.S.A.", Pandora]
    Africa: [Discovery Island, Asia, Pandora]
    Asia: [Discovery Island, Africa, "DinoLand U.S.A."]
    "DinoLand U.S.A.": [Discovery Island, Asia]
    Pandora: [Discovery Island, Africa]
Hollywood Studios:
  adjacency:
    Hollywood Boulevard: [Sunset Boulevard, Animation Courtyard, Toy Story Land, Echo Lake, Muppet Courtyard, "Galaxy's Edge"]
    Sunset Boulevard: [Hollywood Boulevard, Animation Courtyard, Toy Story Land]
    Animation Courtyard: [Hollywood Boulevard, Sunset Boulevard, Toy Story Land]
    Toy Story Land: [Hollywood Boulevard, Sunset Boulevard, Animation Courtyard, "Galaxy's Edge"]
    Echo Lake: [Hollywood Boulevard, Muppet Courtyard]
    Muppet Courtyard: [Hollywood Boulevard, Echo Lake, "Galaxy's Edge"]
    "Galaxy's Edge": [Hollywood Boulevard, Toy Story Land, Muppet Courtyard]
