# Default game length presets. These seed the game_presets table; after
# that, balance is tuned on the in-app Game settings page (and "Reset to
# defaults" there brings back these values). Field meanings and allowed
# ranges live in GamePreset::FIELDS. Tuned for Animal Kingdom, the main
# playtest park.
sprint:
  label: Sprint (2-4 hours)
  hours: 3
  tick_minutes: 25
  hand_size: 2
  influence_price: 1
  starting_strength: 10
  risings: 2
  rising_push: 3
  outbreak_at: 3
  outbreak_limit: 4
full_day:
  label: Full Day
  hours: 10
  tick_minutes: 38
  hand_size: 3
  influence_price: 1
  starting_strength: 10
  risings: 4
  rising_push: 3
  outbreak_at: 3
  outbreak_limit: 6
multi_day:
  label: Multi-day
  days: 3
  day_start: "09:00"
  day_end: "21:00"
  tick_minutes: 45
  hand_size: 3
  influence_price: 1
  starting_strength: 10
  risings: 6
  rising_push: 3
  outbreak_at: 3
  outbreak_limit: 8
