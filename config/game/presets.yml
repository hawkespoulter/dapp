# Game length presets. tick_minutes is how often the villain acts.
sprint:
  label: Sprint (2-4 hours)
  hours: 3
  tick_minutes: 15
  hand_size: 2
  risings: 2
  outbreak_limit: 4
full_day:
  label: Full Day
  hours: 10
  tick_minutes: 27
  hand_size: 3
  risings: 4
  outbreak_limit: 6
multi_day:
  label: Multi-day
  days: 3
  day_start: "09:00"
  day_end: "21:00"
  tick_minutes: 40
  hand_size: 3
  risings: 6
  outbreak_limit: 8
