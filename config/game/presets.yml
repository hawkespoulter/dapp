# Default game length presets. These seed the game_presets table; after
# that, balance is tuned on the in-app Game settings page (and "Reset to
# defaults" there brings back these values). Field meanings and allowed
# ranges live in GamePreset::FIELDS. Tuned for Animal Kingdom, the main
# playtest park, so the balance sim wins about 40% of games (3 challenge
# attempts an hour, 1 in 10 failed in hard mode, no power-ups); people should
# do better than the sim.
sprint:
  label: Sprint (2-4 hours)
  hours: 3
  tick_minutes: 36
  hand_size: 3
  influence_price: 1
  starting_strength: 10
  risings: 2
  outbreak_at: 3
  hard_mode: true
  price_forecast: 3
  price_stall: 5
  price_shield: 3
  price_redraw: 2
  price_double_down: 2
  price_safety_net: 3
full_day:
  label: Full Day
  hours: 10
  tick_minutes: 41
  hand_size: 3
  influence_price: 1
  starting_strength: 10
  risings: 4
  outbreak_at: 3
  hard_mode: true
  price_forecast: 3
  price_stall: 5
  price_shield: 3
  price_redraw: 2
  price_double_down: 2
  price_safety_net: 3
multi_day:
  label: Multi-day
  days: 3
  day_start: "09:00"
  day_end: "21:00"
  tick_minutes: 42
  hand_size: 3
  influence_price: 1
  starting_strength: 10
  risings: 6
  outbreak_at: 3
  hard_mode: true
  price_forecast: 3
  price_stall: 5
  price_shield: 3
  price_redraw: 2
  price_double_down: 2
  price_safety_net: 3
