# The game's default settings. These seed the game_presets table; after
# that, balance is tuned on the in-app Game settings page (and "Reset to
# defaults" there brings back these values). Field meanings and allowed
# ranges live in GamePreset::FIELDS.
#
# Every game plays the same way; the host picks how long it lasts and how
# fast the villain moves (Easy, Normal or Hard).
standard:
  label: Standard
  hours: 3
  easy_minutes: 45
  normal_minutes: 30
  hard_minutes: 20
  hand_size: 3
  starting_strength: 10
  risings: 2
  outbreak_at: 3
  youngling_max: 2
  shared_hand: true
  hard_mode: true
  price_forecast: 1
  price_stall: 2
  price_shield: 1
  price_redraw: 1
  price_double_down: 2
  price_safety_net: 2
