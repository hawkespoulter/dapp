# Claim challenges for Hollywood Studios: touch something in the area. See README.md.
Hollywood Boulevard:
  - title: Hand in Hand
    description: Put your hand in one of the celebrity handprints in front of the Chinese Theater.
Sunset Boulevard:
  - title: Hotel Gates
    description: Touch the gates of the Hollywood Tower Hotel (Tower of Terror).
Echo Lake:
  - title: Lakeside
    description: Touch the railing around Echo Lake.
Toy Story Land:
  - title: Toy Sized
    description: Touch one of the giant Tinkertoy or Lincoln Logs props.
Galaxy's Edge:
  - title: Black Spire
    description: Touch one of the big stone spires in Black Spire Outpost.
Animation Courtyard:
  - title: Drawn In
    description: Touch the Animation Courtyard entrance archway.
Muppet Courtyard:
  - title: Muppet Fountain
    description: Touch the edge of the Muppets fountain in Muppet Courtyard.
