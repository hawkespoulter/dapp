# Claim challenges for Magic Kingdom: touch something in the area. See README.md.
Main Street, U.S.A.:
  - title: Lamplighter
    description: Touch the base of one of the Main Street lampposts.
Adventureland:
  - title: Tiki Touch
    description: Touch one of the tiki statues by the Enchanted Tiki Room.
Frontierland:
  - title: Hitching Post
    description: Touch one of the hitching posts along the Frontierland boardwalk.
Liberty Square:
  - title: Let Freedom Ring
    description: Touch the Liberty Bell replica.
Fantasyland:
  - title: Sword in the Stone
    description: Touch the Sword in the Stone (pulling it out is optional).
Tomorrowland:
  - title: Space Marquee
    description: Touch the Space Mountain sign at its entrance.
