# Claim challenges for Animal Kingdom: touch something in the area. See README.md.
Discovery Island:
  - title: Roots of Life
    description: Touch one of the Tree of Life's roots along the Discovery Island trails.
Africa:
  - title: Harambe Gate
    description: Touch the archway gate into Harambe village.
Asia:
  - title: Prayer Wheel
    description: Spin one of the prayer wheels near Expedition Everest.
DinoLand U.S.A.:
  - title: Dino Touch
    description: Touch any dinosaur statue or skeleton in DinoLand.
Pandora:
  - title: Glowing Plants
    description: Touch one of the plants by the Na'vi River Journey that light up or move when touched.
