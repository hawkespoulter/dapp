# Claim challenges for Animal Kingdom. See README.md.
Discovery Island:
  - title: Tree of Life Portrait
    description: Take a group photo with the Tree of Life behind you, everyone pointing at a different carved animal.
Africa:
  - title: Harambe Headcount
    description: Stand in Harambe village and find 10 animals painted, carved or printed on the buildings around you.
Asia:
  - title: Prayer Flags
    description: Find a string of prayer flags in Anandapur and take a group photo underneath it.
DinoLand U.S.A.:
  - title: Fossil Find
    description: Find a dinosaur skeleton or statue in DinoLand and pose as that dinosaur for a group photo.
Pandora:
  - title: Banshee Flight
    description: Stand under the floating mountains and take a photo of everyone flying like a banshee.
