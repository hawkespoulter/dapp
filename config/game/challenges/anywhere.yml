# Challenges that can be done in any park. See README.md for the fields.

- title: Hidden Mickey
  description: Find a Hidden Mickey. You can look up hidden Mickey Locations but you must see it.
  reward: 1

- title: Character Photo
  description: Get a photo with any costumed character. You do not have to wait in line.
  reward: 2

- title: Snack Attack
  description: Buy a snack you've never had before.
  reward: 1

- title: Back to Back
  description: Ride two different attractions within 45 minutes.
  reward: 3

- title: Guess the queue time
  description: Accurately guess the wait time of a ride. Timer stops when you get off the ride. You must be within 10%
  reward: 3

- title: Wait It Out
  description: Ride an attraction with a wait of 45 minutes or more.
  reward: 5

- title: GeoGuessr
  description: Visit the location of the photo.
  list: {from: geoguessr, count: 1}
  reward: 3

- title: Splish Splash
  description: Ride any water ride. One of you has to come off visibly wet.
  reward: 3

- title: Bluddle uddle um dum
  description: Wash your hands in a themed bathroom.
  reward: 1

- title: Pin Trading
  description: Trade a mystery pin for a pin from the park. 
  reward: 5

- title: Focus
  description: Close your eyes on a ride. After 30 seconds correctly identify where you are on the ride. 
  reward: 2
- title: Hide and Seek
  description: One player rolls a number from 1 to 5 and hides. The rest of the team has that many minutes to find them.
  reward: 3

- title: Blind taste test
  description: One teammate secretly buys a snack. Another teammate must correctly identify it with their eyes closed.
  reward: 2

- title: Date a ride
  description: Guess the year this ride opened, without your phone. You must be within 3 years. Tap Reveal once you've guessed.
  list: {from: ride_openings, count: 1}
  reward: 3

- title: Find each other
  description: Split up for 5 minutes, then find each other within 10 minutes. No phones, and no planning where to meet.
  reward: 4

- title: Spot an influencer
  description: Spot an influencer. They must be actively filming.
  reward: 2

- title: Coaster portrait
  description: Photograph a moving roller coaster with the nose of the train in frame. Stand perpendicular to the track, as close as you can get.
  reward: 3

- title: Ride a mile of coasters
  description: Ride roller coasters until you've covered 1 mile of track in total. You may look up track lengths.
  reward: 8
