# Magic Kingdom challenges. See README.md for the fields.

- title: Castle Selfie
  description: Take a group selfie with Cinderella Castle fully in frame.
  reward: 1

- title: Madame Leota
  description: Find Madame Leota's tombstone by the Haunted Mansion and wait for her eyes to open.
  reward: 4

- title: Kidney Stone Cure
  description: Ride Big Thunder Mountain twice in a row.
  reward: 10

- title: Galactic hero
  description: Score a combined 1,000,000 points on Buzz Lightyear's Space Ranger Spin.
  reward: 10

- title: Ride Cinderella's horse
  description: Find Cinderella's horse on Prince Charming Regal Carrousel (the one with the gold ribbon on its tail) and ride it.
  reward: 3

- title: Float wave
  description: During a parade, wave at a character on a float and get a wave back.
  reward: 3

- title: Mr. Toad's grave
  description: Find Mr. Toad's tombstone in the Haunted Mansion pet cemetery.
  reward: 3

- title: Sensory overload
  description: During Mickey's PhilharMagic, everyone has to notice this effect.
  list: {from: philharmagic_effects, count: 1}
  reward: 2

- title: Presidential roll call
  description: In The Hall of Presidents, correctly spot each of these presidents. You may use your phone.
  list: {from: presidents, count: 5}
  reward: 3
